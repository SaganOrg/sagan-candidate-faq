<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Page not found — Sagan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .lost { padding: 4rem 0 6rem; }
  .lost h1 { margin-bottom: 1rem; }
  .lost .cta {
    display: inline-block;
    margin-top: 1.75rem;
    padding: .875rem 1.5rem;
    background: var(--glacier);
    border-radius: 999px;
    color: var(--white);
    font-family: var(--label);
    font-size: .875rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-decoration: none;
    transition: background-color .18s ease, color .18s ease;
  }
  .lost .cta:hover { background: var(--white); color: var(--glacier); box-shadow: inset 0 0 0 1px var(--glacier); }
</style>
</head>
<body>

<header class="topbar">
  <div class="shell topbar__inner">
    <span class="logo">
      <svg class="logo__mark" viewBox="0 0 96 96" role="img" aria-label="Sagan">
        <circle cx="48" cy="48" r="43.5" fill="none" stroke="#093A3E" stroke-width="7.5"
                stroke-dasharray="129.07 7.59" transform="rotate(52 48 48)"/>
        <circle cx="48" cy="48" r="31.9" fill="#25A2FF"/>
      </svg>
      <span class="logo__word">Sagan</span>
    </span>
    <span class="topbar__label">Candidate Support</span>
  </div>
</header>

<main class="shell lost">
  <p class="eyebrow">Error 404</p>
  <h1>Page not found</h1>
  <p class="lede">The page you asked for does not exist. The Candidate FAQ has the answers to the questions we are asked most often.</p>
  <a class="cta" href="/">Go to the Candidate FAQ</a>
</main>

</body>
</html>
